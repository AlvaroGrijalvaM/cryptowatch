plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.kapt'
}

repositories {
    google()
    mavenCentral()
}

android {
    compileSdk 34
    defaultConfig {
        applicationId "com.cryptowatch.mobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    
        // Permisos necesarios
        manifestPlaceholders = [
            onesignalNotificationId: "123456"
        ]
    }
    
    buildFeatures {
        compose true
    }
    
    compose {
        kotlinCompilerExtensionVersion = "1.5.0"
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    kotlin "1.8.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0"
    implementation "androidx.core:core-ktx:1.13.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.0"
    implementation "androidx.activity:activity-compose:1.8.0"
    implementation "androidx.compose.ui:ui:1.6.7"
    implementation "androidx.compose.material:material:1.6.7"
    implementation "androidx.compose.ui:ui-tooling-preview:1.2.0"
    implementation "androidx.compose.material3:material3:1.2.0"
    implementation "androidx.window:window-compose:1.2.0"
    // WorkManager para tareas periódicas
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    // Room Database
    implementation "androidx.room:room-ktx:2.5.0"
    implementation "androidx.room:room-rxjava2:2.5.0"
    kapt "androidx.room:room-compiler:2.5.0"
    // API de criptomonedas (Retrofit + Moshi)
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-moshi:2.11.0"
    implementation "com.squareup.moshi:moshi:3.14.0"
    implementation "com.squareup.moshi:moshi-kotlin:3.14.0"
    implementation "com.squareup.moshi:moshi-adapters:3.14.0"
    // Firebase/GCM para notificaciones
    implementation "com.google.android.gms:play-services-basement:18.0.0"
    // Wearable Data Layer
    implementation "androidx.wear:wear-remote-data-layer:1.3.0"
}